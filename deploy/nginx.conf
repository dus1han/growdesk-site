# Container-internal server. Caddy (or the raw port, before a domain exists)
# sits in front; TLS and security headers are Caddy's job.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    # Hashed build output never changes under the same name.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
